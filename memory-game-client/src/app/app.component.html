<div class="page-wrapper">
  <header class="header-bar">
    <div class="header-container">
      <a class="site-title" [routerLink]="['/game']">{{ appTitle }}</a>

      <nav class="nav-tabs">
        <a
          class="tab-btn"
          [routerLink]="['/game']"
          routerLinkActive="active">
          اللعب
        </a>

        <a
          class="tab-btn"
          [routerLink]="['/player']"
          routerLinkActive="active">
          {{ loggedInPlayer ? ('حسابي وتقدم اللاعبات (' + loggedInPlayer.username + ')') : 'تسجيل دخول / حساب جديد' }}
        </a>

        <a
          class="tab-btn admin-tab-btn"
          [routerLink]="['/admin']"
          routerLinkActive="active">
          دخول المشرف (Admin)
        </a>
      </nav>
    </div>
  </header>

  <router-outlet></router-outlet>
</div>
